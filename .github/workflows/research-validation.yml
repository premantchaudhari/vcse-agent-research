name: Research validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Offline tests and browser fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-benchmark.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-benchmark.txt
          python -m playwright install --with-deps chromium
      - name: Run VCSE offline tests (synthetic fixtures)
        run: python -m unittest discover -s tests -v
      - name: Run comparison harness offline tests
        run: python -m unittest discover -s comparisons/tests -v
      - name: Check Python syntax
        run: python -m compileall -q vcse comparisons/tools

  history-secrets:
    name: Git history secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan all reachable refs
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git --redact --exit-code 1 --verbose --log-opts='--all' .
